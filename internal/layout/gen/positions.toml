# The physical keys of the ISO keyboard, top row first, and the hand and finger
# that press each one. Ids are Macintosh keycodes (k<code>) and are shared by
# every layout: k10 is left of 1, k50 right of the left Shift, k42 left of Enter
# on the home row, k36 is Enter and k49 the space bar. layoutgen takes the rows
# of every generated layout from here.

[[row]]
keys = [
  { id = "k10", hand = "left", finger = "pinky" },
  { id = "k18", hand = "left", finger = "pinky" },
  { id = "k19", hand = "left", finger = "ring" },
  { id = "k20", hand = "left", finger = "middle" },
