# Incident scenarios: the final boss of each chapter, plus free-play extras.
#
# An incident is an ordered list of steps. Only `text` is typed; `prompt` is the
# Czech story line shown above it. Every character of `text` must be unlocked
# by the end of the incident's chapter (see the chapter table in
# curriculum.toml), and a text line is at most 56 columns. Chapter incidents
# are INC-1001 to INC-1012, free-play extras start at INC-2001. Ids are stable:
# they key the stored best severities and ghosts.

[[incident]]
id = "INC-1001"
title = "Sklad přestal odpovídat"
chapter = "ch01"
  [[incident.step]]
  prompt = "Sklad přestal odpovídat. Monitoring to hlásí už třetí hodinu. Přihlas se na něj."
  text = "ssh sklad"
  lang = "shell"
  [[incident.step]]
  prompt = "Podívej se, co tam vlastně leží. Čekej cokoli, jen ne pořádek."
  text = "ls sklad"
  lang = "shell"
  [[incident.step]]
  prompt = "V logu stojí jediné slovo. Zapiš viníka do hlášení."
  text = "had dal sůl"
  [[incident.step]]
  prompt = "Spusť záchranný skript. Autor odešel, skript zůstal."
  text = "sh alfa"
  lang = "shell"

[[incident]]
id = "INC-1002"
title = "Java žere všechen procesor"
chapter = "ch02"
  [[incident.step]]
  prompt = "Procesor běží na plný výkon a nikdo neví proč. Podívej se, kdo ho zaměstnává."
  text = "top"
  lang = "shell"
  [[incident.step]]
  prompt = "Na špici je cosi, co se jmenuje jako městečko, ne jako služba. Najdi jeho proces."
  text = "pgrep jetty"
  lang = "shell"
  [[incident.step]]
  prompt = "Rozhodnutí padlo. Ukonči všechno, co se tak jmenuje. Dohled službu sám zase nahodí, takže to je restart, jen drsnější."
  text = "sudo pkill jetty"
  lang = "shell"
  [[incident.step]]
  prompt = "Ověř, že dohled proces opravdu vzkřísil a má nové číslo."
  text = "pgrep jetty"
  lang = "shell"
  [[incident.step]]
  prompt = "Naposledy se podívej, jestli procesor konečně vydechl."
  text = "top"
  lang = "shell"

[[incident]]
id = "INC-1003"
title = "Nginx mlčí a nikdo neví proč"
chapter = "ch03"
  [[incident.step]]
  prompt = "Nginx nehlásí chybu. Nehlásí vůbec nic, což je podezřelé. Podívej se do jeho logu."
  text = "tail nginx.log"
  lang = "shell"
  [[incident.step]]
  prompt = "Najdi řádky, které autor logu považoval za chybu. Zbytek je jen šum."
  text = "grep error nginx.log"
  lang = "shell"
  [[incident.step]]
  prompt = "Chyba je v konfiguraci. Zálohuj ji dřív, než ji rozbiješ. Nikdo to nedělá, ale všichni toho litují."
  text = "cp nginx.conf nginx.bak"
  lang = "shell"
  [[incident.step]]
  prompt = "Oprav konfiguraci. Chybí v ní středník, jako vždycky."
  text = "vim nginx.conf"
  lang = "shell"
  [[incident.step]]
  prompt = "Nasazení: restartuj nginx a doufej, že už mluví."
  text = "sudo service nginx restart"
  lang = "shell"

[[incident]]
id = "INC-1004"
title = "Nasazení v pátek odpoledne"
chapter = "ch04"
  [[incident.step]]
  prompt = "Nasazení v pátek odpoledne, co by se mohlo pokazit. Podívej se, co se změnilo."
  text = "git log -p"
  lang = "shell"
  [[incident.step]]
  prompt = "Zjisti, kdo se podepsal pod ten řádek. Je to jen kvůli statistice."
  text = "git blame -w App.py"
  lang = "shell"
  [[incident.step]]
  prompt = "Sleduj log naživo a modli se."
  text = "tail -f app.log"
  lang = "shell"
  [[incident.step]]
  prompt = "Zapiš do chatu, co se děje. Správná odpověď je vždycky stejná."
  text = "Who broke prod? Not me!"
  [[incident.step]]
  prompt = "Pošli opravu s popisem, který nikoho nepopudí."
  text = "git commit -m Fix"
  lang = "shell"

[[incident]]
id = "INC-1005"
title = "Zákazník vidí hieroglyfy"
chapter = "ch05"
  [[incident.step]]
  prompt = "Zákazník píše, že aplikace mluví v hieroglyfech. Opiš jeho hlášení, ať máme důkaz."
  text = "Chyba: spojení se nezdařilo!"
  [[incident.step]]
  prompt = "Prohledej log na slovo, které se tam nemělo dostat."
  text = "grep -i příliš app.log"
  lang = "shell"
  [[incident.step]]
  prompt = "Zjisti, v jakém kódování je soubor se zprávami."
  text = "file -i hlášení.txt"
  lang = "shell"
  [[incident.step]]
  prompt = "Napiš zákazníkovi omluvu. Diakritika je to nejmenší, co mu dlužíme."
  text = "Omlouváme se, už se to nikdy nestane."

[[incident]]
id = "INC-1006"
title = "Chyba 500 v nejhorší možnou chvíli"
chapter = "ch06"
  [[incident.step]]
  prompt = "Zákazníci vidí chybu 500. Najdi ji v přístupovém logu."
  text = "grep 500 access.log"
  lang = "shell"
  [[incident.step]]
  prompt = "Kolik jich je? Číslo ukážeš vedení, ať si zvykne."
  text = "grep -c 500 access.log"
  lang = "shell"
  [[incident.step]]
  prompt = "Proces visí a na slušné požadavky nereaguje. Zabij ho natvrdo."
  text = "kill -9 4242"
  lang = "shell"
  [[incident.step]]
  prompt = "Ověř, že na portu 8080 zase někdo odpovídá."
  text = "curl localhost:8080"
  lang = "shell"
  [[incident.step]]
  prompt = "Přečti si posledních dvacet řádků a zachovej klid."
  text = "tail -n 20 app.log"
  lang = "shell"

[[incident]]
id = "INC-1007"
title = "Služba zdravá, jen nežije"
chapter = "ch07"
  [[incident.step]]
  prompt = "Logy leží v /var/log, kde jinde. Přejdi tam."
  text = "cd /var/log"
  lang = "shell"
  [[incident.step]]
  prompt = "Zeptej se služby, jak se má. Obvykle odpoví lépe než lidé."
  text = "curl -s localhost:8080/health"
  lang = "shell"
  [[incident.step]]
  prompt = "Nastav port natvrdo. Kolega ho prý nastavil taky, jinde."
  text = "export PORT=8080"
  lang = "shell"
  [[incident.step]]
  prompt = "Startovací skript nemá právo ke spuštění. Dej mu ho."
  text = "chmod +x run.sh"
  lang = "shell"
  [[incident.step]]
  prompt = "Pošli opravu. Zpráva commitu je v uvozovkách, protože má mezery."
  text = "git commit -m \"Fix port 8080\""
  lang = "shell"

[[incident]]
id = "INC-1008"
title = "Tajemství v proměnné PATH"
chapter = "ch08"
  [[incident.step]]
  prompt = "Aplikace na produkci nenajde vlastní program. Přihlas se tam jako uživatel deploy, heslo je prý na nástěnce."
  text = "ssh deploy@prod"
  lang = "shell"
  [[incident.step]]
  prompt = "Diagnóza: vypiš PATH a přijmi pravdu. Adresář /opt/bin v něm chybí."
  text = "echo $PATH"
  lang = "shell"
  [[incident.step]]
  prompt = "Oprava první: přidej chybějící adresář na konec cesty."
  text = "export PATH=$PATH:/opt/bin"
  lang = "shell"
  [[incident.step]]
  prompt = "Oprava druhá: v konfiguraci zůstal starý port 8000. Vyměň ho za správný."
  text = "sed -i 's/8000/8080/' app.conf"
  lang = "shell"
  [[incident.step]]
  prompt = "Nasazení: spusť startovací skript a hned se zeptej, jak dopadl. Nula znamená úspěch."
  text = "./run.sh; echo $?"
  lang = "shell"

[[incident]]
id = "INC-1009"
title = "Roura se ucpala"
chapter = "ch09"
  [[incident.step]]
  prompt = "Disk se plní logy. Zjisti, která služba je zapisuje: vyber druhý sloupec, seřaď, spočítej a ulož do souboru."
  text = "cut -d' ' -f2 app.log | sort | uniq -c > top.txt"
  lang = "shell"
  [[incident.step]]
  prompt = "Seřaď počty od největšího a vezmi první řádek. Pachatel by měl být vidět."
  text = "sort -rn top.txt | head -n 1"
  lang = "shell"
  [[incident.step]]
  prompt = "Pachatel je billing. Zapiš si číslo jeho procesu a rovnou ho vypiš."
  text = "pgrep -f billing > pid.txt && cat pid.txt"
  lang = "shell"
  [[incident.step]]
  prompt = "Zastav ho natvrdo podle zapsaného čísla. Slušně to už zkoušel někdo před tebou."
  text = "kill -9 $(cat pid.txt) && echo stopped"
  lang = "shell"
  [[incident.step]]
  prompt = "Ověř, že billing už do logu nepíše. Nula je dobrá zpráva."
  text = "tail -n 5 app.log | grep -c billing"
  lang = "shell"

[[incident]]
id = "INC-1010"
title = "Přehřátý rack"
chapter = "ch10"
  [[incident.step]]
  prompt = "Teploměr v serverovně ukazuje nesmysl. Opiš hlášení přesně, včetně stupňů."
  text = "CPU: 95°C, fan: 0 rpm!"
  [[incident.step]]
  prompt = "Provozní řád serverovny cituje zákon. Opiš paragraf, ať má právník radost."
  text = "Podle § 12 odst. 3 smí být v racku horko."
  [[incident.step]]
  prompt = "Mrtvé klávesy si zaslouží svůj vlastní řádek. Napiš je jednu po druhé."
  text = "ˇ ¨ ° §"
  [[incident.step]]
  prompt = "Vypni stroj, než se vypne sám."
  text = "sudo shutdown -h now"
  lang = "shell"
  [[incident.step]]
  prompt = "Zapiš do hlášení, jak to dopadlo."
  text = "Teplota klesla pod 40°C."

[[incident]]
id = "INC-1011"
title = "auth handler vrací 500"
chapter = "ch11"
  [[incident.step]]
  prompt = "Diagnóza: spočítej pády v logu autentizace."
  text = "grep -c 'panic: nil pointer' /var/log/auth.log"
  lang = "shell"
  [[incident.step]]
  prompt = "Ověř to v clusteru. Posledních pět minut stačí, víc by bolelo."
  text = "kubectl logs deploy/auth --since=5m | grep panic"
  lang = "shell"
  [[incident.step]]
  prompt = "Oprava: handler nezkontroluje, že uživatel existuje. Přidej kontrolu."
  text = "if user == nil {\n    http.Error(w, \"no user\", 401)\n    return\n}"
  lang = "go"
  [[incident.step]]
  prompt = "Commitni opravu, ať vypadá důležitěji, než byla."
  text = "git commit -am \"fix(auth): nil user returns 401\""
  lang = "shell"
  [[incident.step]]
  prompt = "Nasazení: otaguj verzi a pošli tag. Pipeline z něj postaví image a nasadí ho."
  text = "git tag v1.4.2 && git push --tags"
  lang = "shell"

[[incident]]
id = "INC-1012"
title = "Půlnoc, pátek, produkce"
chapter = "ch12"
  [[incident.step]]
  prompt = "Služba api padá na paměť. Najdi v journalu oběť OOM killeru."
  text = "ssh ops@prod-3 'journalctl -u api -n 50 | grep -i oom'"
  lang = "shell"
  [[incident.step]]
  prompt = "Podívej se do databáze, které úlohy nikdy neskončily."
  text = "SELECT id, state FROM jobs WHERE state <> 'done';"
  lang = "sql"
  [[incident.step]]
  prompt = "Oprava: worker nemá časový limit a čeká věčně. Dej mu pět sekund."
  text = "ctx, cancel := context.WithTimeout(ctx, 5*time.Second)\ndefer cancel()"
  lang = "go"
  [[incident.step]]
  prompt = "Commitni a pošli to do repozitáře. Zpráva nemusí lhát, jen mlčet."
  text = "git commit -am \"fix: add timeout\" && git push"
  lang = "shell"
  [[incident.step]]
  prompt = "Nasazení: pipeline postavila image 2.8.1. Nasaď ho do clusteru."
  text = "kubectl set image deploy/api api=reg/api:2.8.1"
  lang = "shell"

[[incident]]
id = "INC-2001"
title = "Cron nespustil zálohu"
chapter = "ch11"
  [[incident.step]]
  prompt = "Záloha se včera v noci nespustila. Zjisti, co o ní ví cron."
  text = "crontab -l | grep backup"
  lang = "shell"
  [[incident.step]]
  prompt = "Podívej se do logu zálohy. Možná tam něco je, možná ne."
  text = "tail -n 50 /var/log/backup.log"
  lang = "shell"
  [[incident.step]]
  prompt = "Oprav řádek v crontabu: tři ráno, log do souboru, chyby taky."
  text = "0 3 * * * /opt/backup.sh >> /var/log/backup.log 2>&1"
  lang = "shell"
  [[incident.step]]
  prompt = "Skript nikdy nebyl spustitelný. Dej mu právo."
  text = "chmod +x /opt/backup.sh"
  lang = "shell"

[[incident]]
id = "INC-2002"
title = "Dotaz, který trvá minutu"
chapter = "ch11"
  [[incident.step]]
  prompt = "Dotaz na objednávky trvá minutu. Zeptej se databáze, jak ho plánuje."
  text = "EXPLAIN ANALYZE SELECT * FROM orders WHERE user_id = 42;"
  lang = "sql"
  [[incident.step]]
  prompt = "Sekvenční průchod miliony řádků. Napiš migraci, která založí index."
  text = "CREATE INDEX CONCURRENTLY idx_orders_user\n    ON orders (user_id);"
  lang = "sql"
  [[incident.step]]
  prompt = "Nasazení: pusť migraci na produkční databázi."
  text = "psql -h prod -f migrations/042_orders_index.sql"
  lang = "shell"
  [[incident.step]]
  prompt = "Ověř, že dotaz teď vrací výsledek dřív, než zákazník odejde."
  text = "SELECT COUNT(*) FROM orders WHERE user_id = 42;"
  lang = "sql"
  [[incident.step]]
  prompt = "Aktualizuj statistiky, ať plánovač taky ví, co se stalo."
  text = "ANALYZE orders;"
  lang = "sql"

[[incident]]
id = "INC-2003"
title = "KeyError v produkci"
chapter = "ch11"
  [[incident.step]]
  prompt = "API padá na KeyError. Najdi traceback i s kontextem před ním."
  text = "grep -B2 KeyError /var/log/app/error.log"
  lang = "shell"
  [[incident.step]]
  prompt = "Klient někdy pošle požadavek bez uživatele. Ošetři to."
  text = "user = data.get(\"user\")\nif user is None:\n    return {\"error\": \"no user\"}, 400"
  lang = "python"
  [[incident.step]]
  prompt = "Pusť testy. Zelená znamená, že se aspoň nic nezhoršilo."
  text = "pytest -q tests/test_api.py"
  lang = "shell"
  [[incident.step]]
  prompt = "Commitni to s poctivým popisem."
  text = "git commit -am \"fix: handle missing user\""
  lang = "shell"
  [[incident.step]]
  prompt = "Nasazení: otaguj verzi a pošli tag, release pipeline se postará o zbytek."
  text = "git tag v2.4.1 && git push --tags"
  lang = "shell"

[[incident]]
id = "INC-2004"
title = "Regulární výraz, který zabil WAF"
chapter = "ch12"
  [[incident.step]]
  prompt = "Firewall překročil časový limit. Spočítej, kolikrát to udělal."
  text = "grep -c 'timeout' /var/log/waf.log"
  lang = "shell"
  [[incident.step]]
  prompt = "Najdi v kódu regex s vnořeným plusem. Tam to začíná."
  text = "grep -rn '+)+' src/"
  lang = "shell"
  [[incident.step]]
  prompt = "Nahraď katastrofální výraz takovým, který nehledá nekonečno."
  text = "^[\\w ]+$"
  lang = "regex"
  [[incident.step]]
  prompt = "Pusť validační testy. Jen ty, na ostatní není čas."
  text = "go test ./... -run TestValidate"
  lang = "shell"

[[incident]]
id = "INC-2005"
title = "Kontejner se pořád restartuje"
chapter = "ch12"
  [[incident.step]]
  prompt = "Kontejner api se restartuje každých pět vteřin. Najdi ho."
  text = "docker ps -a | grep Restarting"
  lang = "shell"
  [[incident.step]]
  prompt = "Přečti si, co řekl, než zmizel."
  text = "docker logs --tail 20 api"
  lang = "shell"
  [[incident.step]]
  prompt = "Chybí proměnná PORT. Doplň ji do Dockerfilu."
  text = "ENV PORT=8080\nEXPOSE 8080\nCMD [\"./api\"]"
  lang = "shell"
  [[incident.step]]
  prompt = "Sestav a spusť znovu a drž palce."
  text = "docker compose up -d --build api"
  lang = "shell"

[[incident]]
id = "INC-2006"
title = "undefined is not a function"
chapter = "ch12"
  [[incident.step]]
  prompt = "Testy padají s klasickou hláškou. Podívej se na konec výpisu."
  text = "npm test -- --watch=false 2>&1 | tail -n 20"
  lang = "shell"
  [[incident.step]]
  prompt = "Profil uživatele někdy neexistuje. Ošetři to řetězením."
  text = "const name = user?.profile?.name ?? \"anon\";"
  lang = "ts"
  [[incident.step]]
  prompt = "Nech typový systém, ať se taky vyjádří."
  text = "tsc --noEmit"
  lang = "shell"
  [[incident.step]]
  prompt = "Commitni opravu. Zpráva má být kratší než omluva."
  text = "git commit -am \"fix: guard optional profile\""
  lang = "shell"
