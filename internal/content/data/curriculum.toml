# The career path: 13 chapters, one per row of the spec's curriculum table.
#
# Each character is introduced by exactly one chapter (`introduces`), and what a
# chapter may use is the sum of `introduces` and `allowed` over it and every
# chapter before it. Chapter 0 introduces nothing; it only practises `f`, `j`
# and space. Inside a chapter a lesson may use what earlier chapters taught plus
# the `focus` of itself and the lessons before it, so early lessons stay small.
#
# Drill lessons use `length` = 6 x the two-star speed, about 72 s at that pace.
# Snippet lessons name snippet ids that Task 11 writes. Incident ids are
# "INC-" and 4 digits, and the incidents themselves are Task 11's too.

