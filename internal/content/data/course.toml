# The course: chapters and lessons in the order they are taught.
#
# A lesson with `focus` teaches those characters. A lesson with `review = true`
# teaches nothing new: it practises characters from earlier lessons. A lesson
# with `lang` is real code, and its pool is the snippets of that language.
# The order of the lessons defines "everything up to this lesson" for a Test.
# `speed` holds the one, two and three star speeds in WPM.

